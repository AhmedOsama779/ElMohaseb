<!-- One icon template, reused by every sidebar item -->
<ng-template #ico let-name>
  <svg class="side__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    @switch (name) {
      @case ('orders') {
        <path d="M6 2h12v20l-3-2-3 2-3-2-3 2z" />
        <path d="M9 8h6M9 12h6" />
      }
      @case ('customers') {
        <circle cx="9" cy="8" r="3.5" />
        <path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5" />
        <circle cx="17.5" cy="9" r="2.5" />
        <path d="M17 14.5c2.5 0 4.5 1.5 4.5 4" />
      }
      @case ('categories') {
        <path d="M7 3l4 7H3z" />
        <circle cx="17.5" cy="6.5" r="3.5" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
        <path d="M14 14h7M14 17.5h7M14 21h7" />
      }
      @case ('services') {
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      }
      @case ('payment') {
        <rect x="2" y="6" width="20" height="12" rx="2" />
        <circle cx="12" cy="12" r="2.5" />
        <path d="M6 12h.01M18 12h.01" />
      }
      @case ('office') {
        <path d="M4 21V5a1 1 0 011-1h9a1 1 0 011 1v16M15 9h4a1 1 0 011 1v11M3 21h18M8 8h3M8 12h3M8 16h3" />
      }
    }
  </svg>
</ng-template>

<div class="shell">

  <aside class="side">
    <div class="side__brand">
      <span class="side__logo">المحاسب</span>
      <span class="side__chip">الإدارة</span>
    </div>

    <nav class="side__nav" aria-label="أقسام الإدارة">
      @for (item of items; track item.label) {
        @if (item.link) {
          <a [routerLink]="item.link" routerLinkActive="active">
            <ng-container *ngTemplateOutlet="ico; context: { $implicit: item.icon }"></ng-container>
            {{ item.label }}
          </a>
        } @else {
          <span class="disabled" title="قريبًا">
            <ng-container *ngTemplateOutlet="ico; context: { $implicit: item.icon }"></ng-container>
            {{ item.label }}
          </span>
        }
      }
    </nav>
  </aside>

  <div class="main">
    <header class="top">
      <h1 class="top__title">بوابة الإدارة</h1>

      <div class="top__user">
        <button type="button" class="top__logout" (click)="logout()">
          تسجيل الخروج
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" />
          </svg>
        </button>
        <span class="top__avatar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
          </svg>
        </span>
      </div>
    </header>

    <div class="content">
      <router-outlet />
    </div>
  </div>

</div>
